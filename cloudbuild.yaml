steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh baitana \
          --zone=asia-southeast2-a \
          --project=keen-airlock-461707-u8 \
          --tunnel-through-iap \
          --strict-host-key-checking=no \
          --quiet \
          --impersonate-service-account=566492197793-compute@developer.gserviceaccount.com \
          --command='
            set -ex

            # --- Konfigurasi Node.js dengan NVM di VM ---
            # Definisikan direktori instalasi NVM di lokasi yang bisa diakses
            export NVM_DIR="/usr/local/nvm" # Menggunakan /usr/local/nvm atau /opt/nvm bisa jadi pilihan
            mkdir -p $NVM_DIR # Pastikan direktori ada

            # Instal NVM jika belum ada (gunakan lokasi kustom)
            if [ ! -f "$NVM_DIR/nvm.sh" ]; then
              echo "Installing NVM to $NVM_DIR..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | NVM_DIR=$NVM_DIR bash
            fi

            # Sumber NVM agar perintahnya tersedia di sesi ini
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Instal versi Node.js yang dibutuhkan (misal v20) dan gunakan
            echo "Installing Node.js v20..."
            nvm install 20
            nvm use 20
            nvm alias default 20 # Set v20 sebagai default untuk sesi mendatang

            # --- Lanjutkan Deployment Aplikasi ---
            cd /var/www/baitana # Pastikan kamu di direktori proyekmu

            git config --global --add safe.directory /var/www/baitana

            if [ -d ".git" ]; then
              git checkout dev || git checkout -b dev
              git pull origin dev
            else
              git clone --branch dev https://github.com/mchardians/baitana.git .
            fi
        
            # Setelah nvm use 20, npm install akan menggunakan Node.js v20
            npm install
            npm run build

            if pm2 list | grep -q "baitana"; then
              pm2 stop baitana
              pm2 delete baitana
            fi
            pm2 start npm --name "baitana" -- start
          '
options:
  logging: CLOUD_LOGGING_ONLY