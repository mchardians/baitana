steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh baitana \
          --zone=asia-southeast2-a \
          --project=keen-airlock-461707-u8 \
          --tunnel-through-iap \
          --strict-host-key-checking=no \
          --quiet \
          --command='
            set -ex

            # Set env vars
            export HOME=/root
            export PATH=/opt/nodejs/bin:$PATH

            # Navigate to project directory
            cd /var/www/baitana

            # Make Git directory safe
            git config --global --add safe.directory /var/www/baitana

            # Clone or pull the latest from dev
            if [ -d ".git" ]; then
              git checkout dev || git checkout -b dev
              git pull origin dev
            else
              git clone --branch dev https://github.com/mchardians/baitana.git .
            fi

            # Install dependencies and build
            npm install
            npm run build

            # Restart app with PM2
            if pm2 list | grep -q "baitana"; then
              pm2 stop baitana
              pm2 delete baitana
            fi
            pm2 start npm --name "baitana" -- start
          '
options:
  logging: CLOUD_LOGGING_ONLY
